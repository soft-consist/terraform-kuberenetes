name: Terraform Plan (PR)

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  vpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ap-northeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform-repo/prod/ap-northeast-2/shared_eks/vpc
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform-repo/prod/ap-northeast-2/shared_eks/vpc
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform-repo/prod/ap-northeast-2/shared_eks/vpc
        run: terraform plan -var-file=prod.tfvars -no-color | tee plan.txt

      - name: Notify PR (PROD)
        run: node scripts/terraform-notifier.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TF_ENV: prod
          PLAN_PATH: terraform-repo/prod/ap-northeast-2/shared_eks/vpc/plan.txt

  eks:
    runs-on: ubuntu-latest
    needs: vpc
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
          aws-region: ap-northeast-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        working-directory: terraform-repo/prod/ap-northeast-2/shared_eks/01/eks
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform-repo/prod/ap-northeast-2/shared_eks/01/eks 
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform-repo/prod/ap-northeast-2/shared_eks/01/eks
        run: terraform plan -var-file=prod.tfvars -no-color | tee plan.txt

      - name: Notify PR (PROD)
        run: node scripts/terraform-notifier.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TF_ENV: prod
          PLAN_PATH: terraform-repo/prod/ap-northeast-2/shared_eks/01/eks/plan.txt